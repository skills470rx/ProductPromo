<!doctype html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>ProductPromo v3</title><link rel="stylesheet" href="style.css"></head><body>
<header><b>▶ ProductPromo <i>v3</i></b><div><button id="toggleEditor">☰ Editor</button><button id="fullscreen">⛶ Fullscreen</button></div></header>
<div class="app">
<aside id="editor">
<label>ชื่อสินค้า<input id="name" value="หูฟังไร้สาย ANC X1"></label>
<div class="row"><label>ราคา<input id="price" value="890"></label><label>ราคาเดิม<input id="old" value="1290"></label></div>
<label>คำโปรย<input id="tag" value="เสียงชัด เบสแน่น ใส่สบาย"></label>
<label>จุดเด่น<textarea id="features">ตัดเสียงรบกวน ANC\nแบตเตอรี่ 30 ชั่วโมง\nกันน้ำ IPX5\nน้ำหนักเบา</textarea></label>
<label>วิธีใช้<textarea id="use">เปิดกล่อง → เชื่อมต่อ Bluetooth → พร้อมใช้งาน</textarea></label>
<label>ข้อควรรู้<textarea id="note">หลีกเลี่ยงการแช่น้ำ และใช้อุปกรณ์ชาร์จที่เหมาะสม</textarea></label>
<div class="box"><b>รูปสินค้า สูงสุด 10 รูป</b><input id="pics" type="file" accept="image/*" multiple><div id="thumbs"></div><small id="picCount">0 / 10</small></div>
<div class="box"><b>เพลงประกอบ</b><input id="music" type="file" accept="audio/*"><small id="musicName">ยังไม่ได้เลือก</small></div>
<div class="row"><label>เวลาต่อภาพ<select id="duration"><option value="3">3 วิ</option><option value="4" selected>4 วิ</option><option value="5">5 วิ</option></select></label><label>สไตล์<select id="theme"><option value="warm">Modern</option><option value="tech">Tech</option><option value="luxury">Luxury</option></select></label></div>
<button class="primary" id="build">✨ สร้างโปรโมท</button>
</aside>
<main>
<div id="capture"><div class="stage warm" id="stage"><div id="slides"></div><div class="bars" id="bars"></div></div></div>
<nav><button id="prev">⏮</button><button id="play">▶ เล่น</button><button id="next">⏭</button><span id="count"></span><button id="mute">🔊</button></nav>
<div class="actions"><button id="export" class="primary">⬇ Export Video</button><button id="fs2">⛶ ดูเต็มจอ</button></div>
<div class="status" id="status">พร้อมสร้างวิดีโอ • Export เป็น WebM จากเบราว์เซอร์</div>
<div id="timeline"></div>
</main></div><audio id="audio"></audio><script src="app.js"></script></body></html>
